<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crop, redact and frame screenshots in your browser.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Local Image Editor</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./examples/workshop.js" defer></script>
  <script src="./editor.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">
      <span class="brand-icon" aria-hidden="true"></span>
      Local Image Editor
    </a>
    <div class="actions">
      <input id="file" type="file" accept="image/*" hidden>
      <button id="open" type="button">Open image</button>
      <button id="undo" type="button" disabled>Undo</button>
      <button id="export" class="primary" type="button" disabled>Export PNG</button>
    </div>
  </header>

  <main class="editor">
    <section class="workspace" aria-labelledby="canvas-title">
      <div class="workspace-header">
        <h1 id="canvas-title">Canvas</h1>
        <span id="dimensions">No image</span>
      </div>
      <div class="stage" id="drop-zone">
        <div class="empty" id="empty">
          <h2>Drop or paste an image</h2>
          <p>Open a file from your device or try the example.</p>
          <button id="sample" type="button">Use sample</button>
        </div>
        <div class="preview" id="preview" hidden>
          <canvas id="canvas" aria-label="Edited image preview"></canvas>
          <div id="selection" class="selection" hidden></div>
        </div>
      </div>
      <div class="workspace-footer">
        <p id="status" role="status">Files stay on this device.</p>
        <button id="replace-sample" class="text-button" type="button" hidden>Use sample</button>
      </div>
    </section>

    <aside class="settings" aria-label="Editing controls">
      <section class="settings-section">
        <h2>Image tools</h2>
        <fieldset id="tools" disabled>
          <legend class="sr-only">Tool</legend>
          <div class="tools">
            <label><input type="radio" name="tool" value="crop" checked>Crop</label>
            <label><input type="radio" name="tool" value="blur">Blur</label>
            <label><input type="radio" name="tool" value="redact">Redact</label>
          </div>
          <p id="tool-help">Drag a box to keep only that part of the image.</p>
          <details>
            <summary>Enter coordinates</summary>
            <form id="coordinates">
              <div class="coordinate-grid">
                <label>Left <input name="left" type="number" min="0" value="0" required></label>
                <label>Top <input name="top" type="number" min="0" value="0" required></label>
                <label>Width <input name="width" type="number" min="1" required></label>
                <label>Height <input name="height" type="number" min="1" required></label>
              </div>
              <button type="submit">Apply selection</button>
            </form>
          </details>
        </fieldset>
      </section>
      <section class="settings-section">
        <h2>Frame</h2>
        <fieldset id="frame" disabled>
          <legend class="sr-only">Frame settings</legend>
          <label class="toggle"><input type="checkbox" name="enabled"> Add a frame</label>
          <fieldset id="frame-fields" disabled>
            <legend class="sr-only">Frame appearance</legend>
            <label class="color">Background <input type="color" name="color" value="#bfdbd6"></label>
            <label class="range"><span>Padding <output id="padding-value">44 px</output></span>
              <input type="range" name="padding" min="0" max="160" value="44">
            </label>
            <label class="range"><span>Corner radius <output id="radius-value">18 px</output></span>
              <input type="range" name="radius" min="0" max="80" value="18">
            </label>
            <label class="toggle"><input type="checkbox" name="shadow" checked> Shadow</label>
          </fieldset>
        </fieldset>
      </section>
    </aside>
  </main>
</body>
</html>
